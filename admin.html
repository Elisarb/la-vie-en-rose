<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gestión de catálogo · La Vie en Rose</title>
  <link rel="icon" href="images/logo-oficial.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main>
    <section id="login-view" class="login-card" hidden>
      <img src="images/logo-oficial.png" alt="La Vie en Rose">
      <p class="eyebrow">Acceso privado</p>
      <h1>Gestión de catálogo</h1>
      <p>Entra para actualizar precios, fotos y disponibilidad.</p>
      <form id="login-form">
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <header class="topbar">
        <div><p class="eyebrow">La Vie en Rose</p><h1>Catálogo</h1><p>Los cambios aparecen inmediatamente en la tienda.</p></div>
        <div class="top-actions"><a href="/" target="_blank">Ver tienda ↗</a><button id="logout" class="quiet">Salir</button></div>
      </header>
      <div class="toolbar">
        <div><strong id="product-count">0 productos</strong><span id="available-count"></span></div>
        <button id="new-product">＋ Añadir producto</button>
      </div>
      <div id="notice" class="notice" hidden role="status"></div>
      <div id="product-list" class="product-list"></div>
    </section>
  </main>

  <dialog id="editor">
    <form id="product-form">
      <div class="dialog-head"><div><p class="eyebrow">Catálogo</p><h2 id="dialog-title">Nuevo producto</h2></div><button type="button" class="icon-button" data-close aria-label="Cerrar">×</button></div>
      <input id="product-id" type="hidden">
      <div class="form-grid">
        <label class="wide">Nombre<input id="name" maxlength="90" required></label>
        <label>Precio (€)<input id="price" type="number" min="1" max="10000" step="0.01" required></label>
        <label>Categoría<select id="category"><option value="flores">Flores</option><option value="detalles">Detalles</option><option value="plantas">Plantas</option></select></label>
        <label class="wide">Descripción<textarea id="description" maxlength="220" required></textarea></label>
        <label>Etiqueta<input id="badge" maxlength="40" placeholder="Favorito"></label>
        <label>Orden<input id="sort-order" type="number" min="0" max="9999" value="100"></label>
        <label class="wide">Foto<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG o WebP · la reduciremos automáticamente para la web</small></label>
        <input id="image-url" type="hidden">
        <label class="switch-row wide"><input id="active" type="checkbox" checked><span>Disponible para comprar</span></label>
      </div>
      <div class="dialog-actions"><button type="button" class="danger" id="delete-product" hidden>Eliminar</button><span></span><button type="button" class="quiet" data-close>Cancelar</button><button type="submit" id="save-product">Guardar cambios</button></div>
    </form>
  </dialog>
  <script src="admin.js"></script>
</body>
</html>
